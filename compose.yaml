services:

  portal:
    build:
      context:  ./app/portal
      dockerfile: Dockerfile
    image: triagedesk-portal:1.0
    #container_name: triagedesk-portal
    
    environment:
      CORE_API: ""
      STATUS_API: ""
    networks:
      - frontend-net
    depends_on:
      core-api:
        condition: service_healthy
      status:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  core-api:
    build:
      context: ./app/core-api
      dockerfile: Dockerfile
    image: triagedesk-core-api:1.0
    #container_name: triagedesk-core-api
    environment:
      APP_ENV: local

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - api-net
      - db-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  status:
    build:
      context: ./app/status
      dockerfile: Dockerfile
    image: triagedesk-status:1.0
    #container_name: triagedesk-status
    
    networks:
      - api-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    #container_name: triagedesk-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - db-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    #container_name: triagedesk-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - frontend-net
      - api-net

    depends_on:
      core-api:
        condition: service_healthy
      status:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  

networks:

  frontend-net:
    name: triagedesk-frontend-net

  api-net:
    name: triagedesk-api-net

  db-net:
    name: triagedesk-db-net
    internal: true

volumes:
  postgres-data: