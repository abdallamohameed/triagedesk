services:

  portal:
    build:
      context: ./app/portal
    image: triagedesk-portal:1.0

    environment:
      CORE_API: ""
      STATUS_API: ""

    ports:
      - "8080:8080"

    networks:
      - app-net

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  core-api:
    build:
      context: ./app/core-api
    image: triagedesk-core-api:1.0

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EC2_INSTANCE_ID: ${EC2_INSTANCE_ID}

    ports:
      - "8081:8081"

    networks:
      - app-net

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  status:
    build:
      context: ./app/status
    image: triagedesk-status:1.0

    ports:
      - "8082:8082"

    networks:
      - app-net

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  app-net:
    driver: bridge